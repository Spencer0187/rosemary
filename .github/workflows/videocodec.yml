name: video decoder

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/*/Cargo.toml'
      - 'crates/videocodec/**'
      - 'crates/mediabackend/**'
      - '.github/workflows/videocodec.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/*/Cargo.toml'
      - 'crates/videocodec/**'
      - 'crates/mediabackend/**'
      - '.github/workflows/videocodec.yml'

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Confirm host architecture
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            test "$(uname -m)" = arm64
          else
            test "$(uname -m)" = x86_64
          fi
      - name: Confirm only the unshipped decoder is opt-in
        run: |
          cargo metadata --no-deps --format-version 1 > "$RUNNER_TEMP/workspace.json"
          python3 - "$RUNNER_TEMP/workspace.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              metadata = json.load(f)
          packages = {p['name']: p['id'] for p in metadata['packages']}
          members = set(metadata['workspace_members'])
          defaults = set(metadata['workspace_default_members'])
          assert packages['videocodec'] in members
          assert defaults == members - {packages['videocodec']}, (
              'unexpected default workspace membership',
              sorted(members - defaults),
              sorted(defaults - members),
          )
          PY
      - name: Prefetch immutable FFmpeg source
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/ffmpeg-source"
          curl --fail --location --retry 3 \
            'https://codeload.github.com/FFmpeg/FFmpeg/tar.gz/946fcce07b6dcd0331c8cc609192aeff5e1924f8' \
            | tar -xz --strip-components=1 -C "$RUNNER_TEMP/ffmpeg-source"
      - name: Test decoder and source integrity
        env:
          ROSEMARY_FFMPEG_SOURCE: ${{ runner.temp }}/ffmpeg-source
        run: cargo test --locked --release -p videocodec --all-targets
      - name: Strict Clippy
        env:
          ROSEMARY_FFMPEG_SOURCE: ${{ runner.temp }}/ffmpeg-source
        run: cargo clippy --locked -p videocodec -p mediabackend --all-targets -- -D warnings
