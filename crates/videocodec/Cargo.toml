[package]
name = "videocodec"
description = "Self-contained software video decoding for Rosemary"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[build-dependencies]
cc = "1.2"
sha2 = "0.10"

[dependencies]
mediabackend = { path = "../mediabackend", default-features = false }

[dev-dependencies]
# Allow the source verifier's exact production code to be exercised as a test.
cc = "1.2"
sha2 = "0.10"
